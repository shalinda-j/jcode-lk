[package]
name = "jcode-verifier"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
glob = "0.3"
ignore = "0.4"
jcode-task-types = { path = "../jcode-task-types" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
